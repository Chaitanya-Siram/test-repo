name: Run Release Please

on:
  push:
    branches:
      - Development

jobs:
  release-please:
    runs-on: ubuntu-latest

    steps:
      - name: Run Release Please
        uses: GoogleCloudPlatform/release-please-action@v3
        with:
          token: ${{ secrets.RELEASE_PR_TOKEN }}
          release-type: simple
          custom-tag: 23.11.${{ github.run_number }}-${{ github.ref }}
