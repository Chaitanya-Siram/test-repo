name: Deployment to UAT

on:
  workflow_dispatch:
    inputs:
      workflow-file-path:
        description: 'UAT/uat.yml'
        required: true

concurrency:
  group: Build and Deploy

jobs:
  build-and-deploy:
    name: Build and Deploy  
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    env:
      NODE_VERSION: ${{ secrets.NODE_VERSION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET_UAT }}
      CDN_DISTRIBUTION_ID: ${{ secrets.CDN_DISTRIBUTION_ID_UAT }}
      AWS_REGION: ${{ secrets.AWS_REGION }}


    steps:
      - name: Checkout the code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v2
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get Yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "::set-output name=dir::$(yarn cache dir)"

      - name: Cache dependencies
        uses: actions/cache@v2
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Yarn install
        run: yarn --prefer-offline

      - name: Build
        run: yarn build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy
        run: |
          aws s3 rm s3://${{ env.S3_BUCKET }}/ --recursive
          aws s3 cp build s3://${{ env.S3_BUCKET }} --cache-control 'public, max-age=31104000' --recursive
          aws configure set preview.cloudfront true
          aws cloudfront create-invalidation --distribution-id ${{ env.CDN_DISTRIBUTION_ID }} --paths "/*"
